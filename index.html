<!DOCTYPE html>

<body>

<header>
  <div class="brand"><span class="mark">h</span>hq</div>

    <button id="refresh" class="meta" type="button" aria-label="Refresh now">refresh</button>

    </button>
  </div>
</header>

<h2>markets</h2>
<div id="chart" hidden></div>

  <span>yahoo · polymarket · le monde · bbc · cnbc · hn</span>
</footer>
